{% extends 'base.html' %}

{% block title %}
    Aggiungi Comprensorio
{% endblock %}
{% block content %}
    <h2>Aggiungi Comprensorio</h2>
    <div class="add-resort">
        <label for="nome">Nome</label><input type="text" name="nome" id="nome" placeholder="Nome comprensorio" required>
        <label for="region">Regione</label>
        <select name="region" id="region" required>
            <option value="">Seleziona una regione</option>

            <option value="Abruzzo">Abruzzo</option>
            <option value="Basilicata">Basilicata</option>
            <option value="Calabria">Calabria</option>
            <option value="Campania">Campania</option>
            <option value="Emilia-Romagna">Emilia-Romagna</option>
            <option value="Friuli-Venezia Giulia">Friuli-Venezia Giulia</option>
            <option value="Lazio">Lazio</option>
            <option value="Liguria">Liguria</option>
            <option value="Lombardia">Lombardia</option>
            <option value="Marche">Marche</option>
            <option value="Molise">Molise</option>
            <option value="Piemonte">Piemonte</option>
            <option value="Puglia">Puglia</option>
            <option value="Sardegna">Sardegna</option>
            <option value="Sicilia">Sicilia</option>
            <option value="Toscana">Toscana</option>
            <option value="Trentino-Alto Adige">Trentino-Alto Adige</option>
            <option value="Umbria">Umbria</option>
            <option value="Valle d'Aosta">Valle d'Aosta</option>
            <option value="Veneto">Veneto</option>
        </select>
        <label for="min-altitude">Altitudine Minima</label><input name="min-altitude" type="number" id="min-altitude" placeholder="Altitudine Minima" required min="1">
        <label for="max-altitude">Altitudine Massima</label><input name="max-altitude" type="number" id="max-altitude" placeholder="Altitudine Massima" required min="1">
        <label for="price">Prezzo</label><input name="price" type="number" id="price" placeholder="Prezzo" min="1" required>
        <button type="submit" id="button">Aggiungi</button>
    </div>

    <script>
        document.getElementById("button").addEventListener("click", () => {
            fetch("/admin/resort/new", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: document.getElementById("nome").value,
                    region: document.getElementById("region").value,
                    min: document.getElementById("min-altitude").value,
                    max: document.getElementById("max-altitude").value,
                    price: document.getElementById("price").value,
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = data.redirect;
                    }
                })
                .catch(err => console.error("Errore:", err));
        });

    </script>
{% endblock %}
